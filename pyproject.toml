[project]
name = "llm-wiki"
version = "0.1.0"
description = "Local-first, self-maintaining knowledge base engine powered by llama.cpp"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flet-charts>=0.86.4",
    "flet-terminal>=0.2.2",
    "flet[cli,desktop]>=0.86.4",
    "loguru>=0.7.3",
    "markdown-it-py>=4.2.0",
    # <2.0.0: mcp 2.0 removed mcp.server.fastmcp (mcp/server.py's FastMCP
    # import). `uv sync` respects uv.lock regardless, but `flet build` runs
    # its own independent pip resolve against this open range -- it picked
    # 2.0.0 and broke the built bundle at import time (compileall doesn't
    # execute imports, so it never caught it at build time).
    "mcp>=1.28.1,<2.0.0",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "openai>=2.49.0",
    "outlines>=1.3.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pygit2>=1.19.3",
    "python-frontmatter>=1.3.0",
    "sqlite-vec>=0.1.9",
    "typer>=0.27.0",
    "watchdog>=6.0.0",
]

[project.scripts]
llm-wiki = "llm_wiki.cli.main:app"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

# `flet build linux` bundles the app with a custom-built Flutter client, which
# is what makes Dart-backed extensions (flet-charts) available. Requires the
# Flutter SDK on PATH; see README.
[tool.flet]
product = "LLM-Wiki"
org = "com.mindderivative"

[tool.flet.app]
path = "src"
module = "main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["llm_wiki"]

[tool.ruff.lint.flake8-bugbear]
# typer's Argument()/Option() calls in defaults are the documented way to
# declare CLI parameters -- not the mutable-default footgun B008 guards against.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m \"not live_llm\""
markers = [
    "live_llm: marks tests that hit a real local llama-server instance (deselected by default)",
]
